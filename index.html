<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filmprep</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@500;600;700;800;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/script.css">
<link rel="stylesheet" href="css/shotlist.css">
<link rel="stylesheet" href="css/breakdown.css">
<link rel="stylesheet" href="css/schedule.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body>

<div id="boot" class="boot">Loading your projects…</div>

<!-- ============ home: your projects ============ -->
<div id="home" class="home" hidden>
  <header class="home-top">
    <span class="tb-brand is-static">Filmprep</span>
    <div class="tb-right">
      <button class="btn ghost" id="homeOpenFile" type="button">Open project file…</button>
      <input type="file" id="homeOpenFileInput" accept=".json,application/json" hidden>
    </div>
  </header>
  <main class="home-main">
    <h2>Your projects</h2>
    <p id="homeNotice" class="notice" hidden></p>
    <div class="home-grid" id="homeGrid"></div>
    <p class="home-foot">Need something that isn't rebuilt yet? The <a href="classic/" id="classicLink" target="_blank" rel="noopener">classic version</a> still has every page.</p>
  </main>
</div>

<!-- ============ editor ============ -->
<div id="editor" class="appshell" hidden>
  <div class="appbar" id="appbar">
  <header class="topbar">
    <div class="tb-left">
      <button class="tb-brand" id="goHome" type="button" title="Back to your projects">Filmprep</button>
      <div class="tb-proj">
        <span class="dot" aria-hidden="true"></span>
        <b id="projName" title="Click to rename" tabindex="0"></b>
      </div>
    </div>
    <div class="tb-right">
      <button class="iconbtn" id="undoBtn" type="button" title="Undo (Ctrl/⌘ Z)" aria-label="Undo" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.5 3.5L2.5 6.5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 6.5h6.5a3.5 3.5 0 010 7H7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="iconbtn" id="redoBtn" type="button" title="Redo (Shift Ctrl/⌘ Z)" aria-label="Redo" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10.5 3.5l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 6.5H6.5a3.5 3.5 0 000 7H9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <span class="tb-meta" id="saveMeta" aria-live="polite"></span>
      <button class="iconbtn" id="shareBtn" type="button" title="Save project file" aria-label="Save project file">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 10V2.5M5 5.5l3-3 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 9v4.5h10V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="iconbtn iconbtn-lg" id="settingsBtn" type="button" title="Settings" aria-label="Settings">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="btn accent" id="exportBtn" type="button">Export</button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar" aria-label="Pages">
    <button type="button" data-page="script">Script</button>
    <button type="button" data-page="shotlist">Shotlist</button>
    <button type="button" data-page="breakdown">Breakdown</button>
    <button type="button" data-page="schedule">Schedule</button>
    <button type="button" data-page="floorplan">Floor plan</button>
    <button type="button" data-page="callsheet">Callsheet</button>
    <button type="button" class="tb-more" id="moreBtn" aria-expanded="false">More <span class="car" aria-hidden="true">▾</span></button>
  </nav>
  <nav class="moredrop" id="moredrop" aria-label="More pages" hidden>
    <button type="button" data-page="camera">Camera</button>
    <button type="button" data-page="locations">Locations</button>
    <button type="button" data-page="sun">Sun path</button>
    <button type="button" data-page="crew">Crew</button>
  </nav>
  </div>

  <main id="page" class="page-host"></main>
</div>

<div id="modalHost"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/store.js"></script>
<script src="js/legacy.js"></script>
<script src="js/script-parse.js"></script>
<script src="js/script.js"></script>
<script src="js/shotlist.js"></script>
<script src="js/breakdown.js"></script>
<script src="js/schedule.js"></script>
<script src="js/formpage.js"></script>
<script src="js/camera.js"></script>
<script src="js/locations.js"></script>
<script src="js/crew.js"></script>
<script src="js/app.js"></script>
</body>
</html>
